# Tum proxy location'larinda kullanilan ortak basliklar.
#
# NOT: nginx'te `proxy_set_header` mirasi "hepsi ya da hicbiri" kuralina tabidir:
# bir location kendi `proxy_set_header` direktifini tanimlarsa (ornegin Upgrade),
# server seviyesindekiler MIRAS ALINMAZ. Bu yuzden bu dosya her location'da
# acikca include edilir; aksi halde Host upstream adina duser (carsties_identity)
# ve IdentityServer discovery'si ic adres uretir.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
