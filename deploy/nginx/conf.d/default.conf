# ============================================================
# Carsties - edge nginx (tek alan adi, path bazli yonlendirme)
#
#   https://umitsengul.online/                     -> statik karsilama sayfasi
#   https://umitsengul.online/carsties/            -> web-app (Next.js, basePath=/carsties)
#   https://umitsengul.online/carsties/api/auth/   -> web-app (better-auth route handler)
#   https://umitsengul.online/carsties/api/        -> gateway-svc  (onek SILINIR)
#   https://umitsengul.online/carsties/id/         -> identity-svc (onek KORUNUR, PathBase)
#
# NOT: /carsties/api/auth/ blogu, /carsties/api/ blogundan daha spesifik oldugu
# icin (nginx "en uzun onek kazanir") gateway'e degil web-app'e gider.
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream carsties_web_app {
    server web-app:3000;
    keepalive 16;
}

upstream carsties_gateway {
    server gateway-svc:80;
    keepalive 16;
}

upstream carsties_identity {
    server identity-svc:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name umitsengul.online;

    # Let's Encrypt HTTP-01 dogrulamasi (certbot webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name umitsengul.online;

    ssl_certificate     /etc/nginx/certs/umitsengul.online.crt;
    ssl_certificate_key /etc/nginx/certs/umitsengul.online.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    # --- Statik karsilama sayfasi (kok dizin) ---
    # NOT: `index` burada calismaz; internal redirect "/index.html" olur ve
    # location / (404) yakalar. try_files ile dogrudan dosya servis edilir.
    location = / {
        root /usr/share/nginx/landing;
        try_files /index.html =404;
    }

    # --- better-auth (Next.js route handler) ---
    location ^~ /carsties/api/auth/ {
        proxy_pass http://carsties_web_app;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # --- Gateway (YARP) : onek silinir -> /carsties/api/auctions => /auctions ---
    location ^~ /carsties/api/ {
        proxy_pass http://carsties_gateway/;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # --- IdentityServer (Duende) : onek KORUNUR (PathBase=/carsties/id) ---
    location ^~ /carsties/id/ {
        proxy_pass http://carsties_identity;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /carsties/id {
        return 301 /carsties/id/;
    }

    # --- Next.js uygulamasi (basePath=/carsties, statik dosyalar dahil) ---
    location ^~ /carsties/ {
        proxy_pass http://carsties_web_app;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # `/carsties` (sondaki slash yok) Next.js'e gider; Next gerekirse
    # kendi 308'ini uretir. Burada 301 vermek "/carsties/ -> 308 -> /carsties"
    # dongusu yaratir, bu yuzden YONLENDIRME YOK.
    location = /carsties {
        proxy_pass http://carsties_web_app;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
    }

    location / {
        return 404;
    }
}
