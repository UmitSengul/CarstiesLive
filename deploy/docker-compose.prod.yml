# ============================================================
# Carsties - VPS (production) override dosyasi
#
# Kullanim (VPS'te /opt/carsties icinde):
#   docker compose --env-file deploy/.env \
#     -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Amac:
#   - tek alan adi (DOMAIN) altinda path bazli yayin -> edge nginx (statik config)
#   - uygulama imajlari GHCR'den cekilir (CI'da build edilir; VPS'te build yok)
#   - ic servislerin portlarini disariya kapatmak
#   - secret'lari deploy/.env uzerinden vermek
#   - restart: unless-stopped + log rotasyonu
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env icinde POSTGRES_PASSWORD gerekli}
    logging: *default-logging

  rabbitmq:
    restart: unless-stopped
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?deploy/.env icinde RABBITMQ_PASS gerekli}
    logging: *default-logging

  meilisearch:
    restart: unless-stopped
    ports: !reset []
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?deploy/.env icinde MEILI_MASTER_KEY gerekli (>=16 byte)}
      MEILI_ENV: production
    logging: *default-logging

  auction-svc:
    restart: unless-stopped
    pull_policy: always
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASS}
      ConnectionStrings__DefaultConnection: Server=postgres:5432;User Id=postgres;Password=${POSTGRES_PASSWORD};Database=auctions
      IdentityServiceUrl: http://identity-svc/carsties/id
      Kestrel__Endpoints__Http__Url: http://+:80
      Kestrel__Endpoints__gRPC__Url: http://+:81
      Kestrel__Endpoints__gRPC__Protocols: Http2
    logging: *default-logging

  bid-svc:
    restart: unless-stopped
    pull_policy: always
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASS}
      ConnectionStrings__BidDbConnection: Server=postgres:5432;User Id=postgres;Password=${POSTGRES_PASSWORD};Database=bids
      IdentityServiceUrl: http://identity-svc/carsties/id
      GrpcAuctionServiceUrl: http://auction-svc:81
    logging: *default-logging

  search-svc:
    restart: unless-stopped
    pull_policy: always
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASS}
      AuctionSvcUrl: http://auction-svc
      Meilisearch__Url: http://meilisearch:7700
      Meilisearch__ApiKey: ${MEILI_MASTER_KEY}
    depends_on:
      auction-svc:
        condition: service_started
    logging: *default-logging

  notify-svc:
    restart: unless-stopped
    pull_policy: always
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASS}
    logging: *default-logging

  identity-svc:
    restart: unless-stopped
    pull_policy: always
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Server=postgres:5432;User Id=postgres;Password=${POSTGRES_PASSWORD};Database=identity
      # Issuer artik path iceriyor: https://<domain>/carsties/id
      IdentityServer__IssuerUri: https://${DOMAIN:?deploy/.env icinde DOMAIN gerekli}/carsties/id
      ClientAppUrl: https://${DOMAIN}/carsties
      # IdentityServer'i alt yol altinda yayinla (discovery/cookie/redirect prefix'leri)
      PathBase: /carsties/id
    logging: *default-logging

  gateway-svc:
    restart: unless-stopped
    pull_policy: always
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:80
      # CORS origin'de PATH OLMAZ (yalniz scheme + host + port).
      ClientApp: https://${DOMAIN}
      IdentityServiceUrl: http://identity-svc/carsties/id
    logging: *default-logging

  web-app:
    restart: unless-stopped
    pull_policy: always
    build:
      args:
        NEXT_PUBLIC_BASE_API: https://${DOMAIN}/carsties/api
        NEXT_PUBLIC_ID_URL: https://${DOMAIN}/carsties/id
        BETTER_AUTH_URL: https://${DOMAIN}
        NEXT_PUBLIC_BASE_PATH: /carsties
    environment:
      BETTER_AUTH_URL: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?deploy/.env icinde BETTER_AUTH_SECRET gerekli}
      # Sunucu tarafi cagrilar edge nginx'i atlar; gateway onegi yok.
      BASE_API_URL: http://gateway-svc
      ID_URL_INTERNAL: http://identity-svc/carsties/id
    volumes: !reset []
    ports: !override
      - "127.0.0.1:3000:3000"
    logging: *default-logging

  # ----------------------------------------------------------------
  # Edge: tek alan adi icin STATIK nginx (nginx-proxy imajinin yerine).
  # TLS burada sonlanir; sertifikalar deploy/certs.sh ile yazilir.
  #   /                            -> statik karsilama sayfasi
  #   /carsties/...                -> web-app
  #   /carsties/api/auth/...       -> web-app (better-auth)
  #   /carsties/api/...            -> gateway (onek silinir)
  #   /carsties/id/...             -> identity (onek korunur)
  # ----------------------------------------------------------------
  nginx-proxy:
    restart: unless-stopped
    container_name: nginx-proxy
    image: nginx:1.29-alpine
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      # DIZIN mount (tek dosya degil): git reset/checkout dosyayi yeni inode ile
      # degistirdiginde tek dosya mount eski icerigi gosterir; dizin mount
      # sayesinde `nginx -s reload` yeni yapilandirmayi gorur.
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/landing:/usr/share/nginx/landing:ro
      - nginx-certs:/etc/nginx/certs:ro
      - nginx-html:/usr/share/nginx/html
    depends_on:
      web-app:
        condition: service_started
      gateway-svc:
        condition: service_started
      identity-svc:
        condition: service_started
    logging: *default-logging

volumes:
  nginx-certs:
  nginx-html:
  letsencrypt:
