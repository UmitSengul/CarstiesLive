# Dependabot: bağımlılık PR'ları (isteğe bağlı GitHub özelliği).
# NOT: CI/CD artık GitHub Actions'a bağlı değil (bkz. deploy/release.sh); bu PR'lar
# otomatik test/deploy TETİKLEMEZ. Yerelde doğrulama: ./deploy/quality.sh
# Tamamen kapatmak istersen bu dosyayı sil (GitHub > Settings > Code security'de
# Dependabot kapalı kalır).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend/web-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /frontend/web-app
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/AuctionService
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
