name: quality (manuel)

# ============================================================
# Bu depoda CI/CD artik GitHub Actions'a bagli DEGIL.
#
# Deploy akisi (GitHub'siz):
#   ./deploy/quality.sh    # kalite kapisi (yerel; bu workflow'un aynisi)
#   ./deploy/release.sh    # yerel build -> SSH ile imaj tasima -> VPS'te deploy
#   ./deploy/deploy.sh     # VPS tarafinda: git reset -> up -d -> nginx reload -> smoke
#
# Bu workflow yalnizca elle tetiklenir (Actions > quality (manuel) > Run workflow);
# push/PR olaylarinda HICBIR sey calismaz, imaj push edilmez, deploy yapilmaz.
# Yine de bulutta dogrulamak istersen kullanilabilir.
# ============================================================

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"
  PUBLIC_DOMAIN: umitsengul.online
  PUBLIC_BASE_PATH: /carsties

permissions:
  contents: read

jobs:
  quality:
    name: Build & test (.NET + Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: dotnet restore
        run: dotnet restore Carsties.sln

      - name: dotnet build
        run: dotnet build Carsties.sln --no-restore -c Release

      # NuGet audit (transitif dahil): bilinen acik varsa job kirilir
      - name: NuGet vulnerability gate
        run: |
          dotnet package list --vulnerable --include-transitive --format json > /tmp/vuln.json
          cat /tmp/vuln.json
          jq -e '[.projects[] | select(.frameworks != null and (.frameworks | length > 0))] | length == 0' /tmp/vuln.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: npm ci
        working-directory: frontend/web-app
        run: npm ci --no-audit --no-fund

      # Runtime bagimliliklarinda HIGH/CRITICAL varsa kirilir (dev bagimliliklari haric)
      - name: npm audit (runtime)
        working-directory: frontend/web-app
        run: npm audit --omit=dev --audit-level=high

      - name: npm lint
        working-directory: frontend/web-app
        run: npm run lint

      - name: next build (prod basePath ile)
        working-directory: frontend/web-app
        env:
          BETTER_AUTH_SECRET: ci-build-only-secret-not-used-at-runtime
          BETTER_AUTH_URL: https://${{ env.PUBLIC_DOMAIN }}
          NEXT_PUBLIC_BASE_API: https://${{ env.PUBLIC_DOMAIN }}${{ env.PUBLIC_BASE_PATH }}/api
          NEXT_PUBLIC_ID_URL: https://${{ env.PUBLIC_DOMAIN }}${{ env.PUBLIC_BASE_PATH }}/id
          NEXT_PUBLIC_BASE_PATH: ${{ env.PUBLIC_BASE_PATH }}
        run: npm run build

      - name: basePath dogrulama
        working-directory: frontend/web-app
        run: jq -e '.basePath == "/carsties"' .next/routes-manifest.json
